# coturn, for the one job WebRTC cannot do by itself.
#
# Two phones normally connect directly: they trade candidate addresses and
# find a path. That works on the same Wi-Fi, and often across a tailnet. It
# fails whenever both ends are behind a NAT that will not hold a port open for
# a stranger — carrier-grade NAT on mobile data is the common case, and it is
# not something either phone can fix from its side.
#
# When that happens the call rings, both ends negotiate happily, and then no
# media ever arrives: ICE runs out of candidate pairs and the connection sits
# in "connecting" until it gives up. A relay is the only answer, and it has to
# be a machine both phones can reach — which is what this server already is.

listening-port=3478

# No TLS listener: there are no certificates here, and a TURN server on a
# private tailnet is already carried over an encrypted link. Declaring a TLS
# port without certs just produces a listener that fails every handshake.

# Bind everything inside the container. What the phones actually see is
# `external-ip`, passed in from TURN_PUBLIC_IP — the container's own address
# is a Docker-internal one that nothing outside can route to.
listening-ip=0.0.0.0
relay-ip=0.0.0.0

fingerprint

# Time-limited credentials, not a fixed password.
#
# A static TURN username and password baked into an app binary is a relay
# anyone who unpacks the APK can use at your expense. REST-style credentials
# are derived from a shared secret and expire; the backend mints them per
# call in routes/calls.js, and coturn verifies them without ever being told
# about a user.
use-auth-secret
realm=loversrock

# Only this pair is meant to use it.
no-multicast-peers

# An open TURN server is a proxy into whatever network it sits on, and this
# one sits on a home LAN. Everything private is denied — loopback, link-local,
# multicast, and all three RFC1918 ranges — so a relay allocation cannot be
# turned around and pointed at the router, the NAS, or the Docker network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# The tailnet is the exception, because that is where both phones live.
# 100.64.0.0/10 is carrier-grade NAT space, which is what Tailscale hands out,
# and is not one of the private ranges denied above.
allowed-peer-ip=100.64.0.0-100.127.255.255

# A couple does not need a thousand sessions.
user-quota=12
total-quota=100

no-cli
