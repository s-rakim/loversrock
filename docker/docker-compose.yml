services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loversrock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loversrock}
      POSTGRES_DB: ${POSTGRES_DB:-loversrock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loversrock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loversrock}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loversrock123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The TURN relay. See docker/turnserver.conf for why a call needs one.
  #
  # Explicitly mapped ports rather than host networking. Host networking is a
  # Linux-only feature — on Docker Desktop for Windows and macOS the container
  # would land in the VM's network namespace, not the machine's, and nothing
  # on the tailnet could reach the relay.
  #
  # The catch with bridging a TURN server is that it would otherwise advertise
  # its container address, which no phone can route to. --external-ip is the
  # answer: it tells coturn to hand out THIS address in its candidates
  # regardless of what its own interface says. Set TURN_PUBLIC_IP to the
  # server's Tailscale address.
  #
  # The relay range is deliberately small. Each call allocates a couple of
  # ports and there are two people, so twenty is generous — and every mapped
  # port costs a userland proxy process on Docker Desktop.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET:-change-me-turn-secret}
      --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}
      --min-port=${TURN_MIN_PORT:-49160}
      --max-port=${TURN_MAX_PORT:-49180}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49180}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49180}/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # Inside the compose network the other services are reachable by service
      # name, not localhost — `localhost` from this container is this container.
      # These override whatever .env says, so the same .env works for both
      # `docker compose up` and running the backend directly with `npm start`.
      DATABASE_URL: postgres://${POSTGRES_USER:-loversrock}:${POSTGRES_PASSWORD:-loversrock}@postgres:5432/${POSTGRES_DB:-loversrock}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      # The backend mints short-lived TURN credentials from this secret, so
      # it must be the same string coturn was started with.
      TURN_SECRET: ${TURN_SECRET:-change-me-turn-secret}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
    ports:
      # 0.0.0.0 on purpose: the phone reaches this over the Tailscale interface,
      # so binding to loopback would make the API unreachable from the app.
      - "0.0.0.0:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules

volumes:
  pgdata:
  miniodata:
