services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loversrock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loversrock}
      POSTGRES_DB: ${POSTGRES_DB:-loversrock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loversrock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio is gone from Docker Hub (MinIO stopped publishing images;
    # the repository now answers "pull access denied"). Anything that makes
    # Docker pull again — a crash, a reset, a new PC — then fails, storage
    # never starts, and the backend, which waits for it, never does either.
    #
    # chainguard/minio is the same MinIO server, built from MinIO's source and
    # kept up to date, so the photos already in the miniodata volume are read
    # as they are: no migration.
    image: chainguard/minio:latest
    restart: unless-stopped
    # This image runs as an unprivileged user; the volume was written by the
    # old image as root. Root here keeps existing files readable and writable.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loversrock}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loversrock123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # No curl or grep in this image, so ask MinIO's health endpoint with
      # bash alone and check the status line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The TURN relay. See docker/turnserver.conf for why a call needs one.
  #
  # Explicitly mapped ports rather than host networking. Host networking is a
  # Linux-only feature — on Docker Desktop for Windows and macOS the container
  # would land in the VM's network namespace, not the machine's, and nothing
  # on the tailnet could reach the relay.
  #
  # The catch with bridging a TURN server is that it would otherwise advertise
  # its container address, which no phone can route to. --external-ip is the
  # answer: it tells coturn to hand out THIS address in its candidates
  # regardless of what its own interface says. Set TURN_PUBLIC_IP to the
  # server's Tailscale address.
  #
  # The relay range is deliberately small. Each call allocates a couple of
  # ports and there are two people, so twenty is generous — and every mapped
  # port costs a userland proxy process on Docker Desktop.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET:-change-me-turn-secret}
      --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}
      --min-port=${TURN_MIN_PORT:-49160}
      --max-port=${TURN_MAX_PORT:-49180}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49180}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49180}/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

  # The call media server (docker/calls): both phones send their camera and
  # microphone here and get the other's back, so a call never needs a path
  # between the two phones themselves, only to this machine, which they
  # already reach for everything else.
  #
  # 4100 is signalling (a websocket), 4101 media over TCP, 4110-4130 media
  # over UDP. CALLS_PUBLIC_IP (or TURN_PUBLIC_IP) is this machine's Tailscale
  # IP: what the server tells the phones to send media to. Without it calls
  # still connect when the server can reach the phones' Tailscale addresses,
  # but set it.
  calls:
    build:
      context: ./calls
    restart: unless-stopped
    environment:
      PEERCALLS_NETWORK_TYPE: sfu
      PEERCALLS_BIND_PORT: "4100"
      PEERCALLS_NETWORK_SFU_PROTOCOLS: udp4,tcp4
      PEERCALLS_NETWORK_SFU_TCP_LISTEN_PORT: "4101"
      PEERCALLS_NETWORK_SFU_UDP_PORT_MIN: "4110"
      PEERCALLS_NETWORK_SFU_UDP_PORT_MAX: "4130"
      # Present and empty: no STUN servers, the phones reach this directly.
      PEERCALLS_ICE_SERVER_URLS: ""
      PEERCALLS_NAT1TO1_IPS: ${CALLS_PUBLIC_IP:-${TURN_PUBLIC_IP:-}}
      PEERCALLS_WS_ORIGIN_PATTERNS: "*"
    ports:
      - "0.0.0.0:4100:4100/tcp"
      - "0.0.0.0:4101:4101/tcp"
      - "0.0.0.0:4110-4130:4110-4130/udp"


  # Collaboration des Esprits: the AI room (it replaced Fable). See
  # docker/esprits/Dockerfile and docs/ESPRITS.md. The app reaches it through
  # the backend (/esprits), which signs each of you in under your own name;
  # port 4300 is published for its full web pages (setup, board, work), which
  # ask for the room's token once per browser.
  esprits:
    build: ./esprits
    restart: unless-stopped
    environment:
      # Empty: one is made on first start and kept in the esprits-secret volume.
      ESPRITS_TOKEN: ${ESPRITS_TOKEN:-}
      # Free Claude Code on this PC, which the room looks for at startup.
      ESPRITS_FCC: ${ESPRITS_FCC:-http://host.docker.internal:8082/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - espritsdata:/data
      - espritssecret:/secret
    ports:
      - "0.0.0.0:4300:4300"
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    # Bring the schema up to date before serving, every start.
    #
    # Migrating used to be a separate command to remember after pulling, and
    # it was missed: new code went live against the old schema and every
    # request touching the new column failed with "column cycle_role of
    # relation users does not exist". schema.sql is written to be re-applied
    # (CREATE ... IF NOT EXISTS, ADD COLUMN IF NOT EXISTS), so running it on
    # every start costs a moment and removes the step.
    #
    # `&&`, not `;`: if the migration fails the server must NOT start on a
    # half-applied schema. The container exits instead, restart policy retries,
    # and the error is the first thing in `docker compose logs backend`.
    # Then the reference lists (games, decks, challenges...) are brought up to
    # date — see `--startup` in seed/run-seed.js. A seed failure is logged
    # but does not stop the server: an app with an old games list beats no
    # app at all.
    #
    # check-packages.js goes first: if the image lost its node_modules (a
    # Docker crash can do that) it says so in one line, with the fix, instead
    # of a stack trace from the first import.
    command: sh -c "node scripts/check-packages.js && node src/config/migrate.js && (node seed/run-seed.js --startup || echo '[seed] failed - starting anyway') && node src/server.js"
    env_file:
      - ../backend/.env
    environment:
      # Inside the compose network the other services are reachable by service
      # name, not localhost — `localhost` from this container is this container.
      # These override whatever .env says, so the same .env works for both
      # `docker compose up` and running the backend directly with `npm start`.
      DATABASE_URL: postgres://${POSTGRES_USER:-loversrock}:${POSTGRES_PASSWORD:-loversrock}@postgres:5432/${POSTGRES_DB:-loversrock}
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: "9000"
      # The backend mints short-lived TURN credentials from this secret, so
      # it must be the same string coturn was started with.
      TURN_SECRET: ${TURN_SECRET:-change-me-turn-secret}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      # The call media server: where the phones reach it (this port, on the
      # address they reach the backend on) and where the backend checks it
      # is up before offering it.
      CALLS_SFU_PORT: "4100"
      CALLS_SFU_HEALTH: http://calls:4100
      # The AI room (Esprits): where it is, and the token it made.
      ESPRITS_URL: http://esprits:4300
      ESPRITS_TOKEN_FILE: /esprits-secret/token
      ESPRITS_PORT: "4300"
      # Free Claude Code, for the daily prompts, quiz and date ideas when
      # backend/.env names no QUIZ_LLM_* model of its own.
      FCC_URL: ${FCC_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - espritssecret:/esprits-secret:ro
    ports:
      # 0.0.0.0 on purpose: the phone reaches this over the Tailscale interface,
      # so binding to loopback would make the API unreachable from the app.
      - "0.0.0.0:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No volumes: the backend runs the code and packages baked into its
    # image. It used to mount ../backend over /app with node_modules in an
    # anonymous volume — and Docker keeps an anonymous volume across
    # rebuilds, so the first new dependency (@anthropic-ai/sdk) was installed
    # in the image and then hidden behind the old node_modules, and the
    # backend crash-looped on "Cannot find package". Updating is
    # `docker compose up -d --build`, which rebuilds the image anyway.

volumes:
  espritsdata:
  espritssecret:
  pgdata:
  miniodata:
